<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/assetes/taskmtaa-logo.jpg" />
    
    <!-- Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#3B82F6" />
    
    <!-- SEO -->
    <meta name="description" content="TaskMtaa - Hyperlocal micro-task marketplace connecting task posters with nearby taskers" />
    <meta name="keywords" content="tasks, jobs, gigs, kenya, nairobi, freelance, local services" />
    
    <!-- Performance -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>TaskMtaa - Find Local Tasks & Taskers</title>
    
    <style>
      /* Prevent iOS zoom on input focus */
      @supports (-webkit-touch-callout: none) {
        input, select, textarea {
          font-size: 16px !important;
        }
      }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      
      /* Loading screen */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s;
        padding: 24px;
      }
      
      #splash-screen.hide {
        opacity: 0;
        pointer-events: none;
      }

      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .splash-logo {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        object-fit: cover;
        background: #fff;
        padding: 6px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      }

      .splash-name {
        margin: 0;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      
      .loader {
        width: 34px;
        height: 34px;
        border: 4px solid rgba(255, 255, 255, 0.85);
        border-bottom-color: transparent;
        border-radius: 50%;
        animation: rotation 1s linear infinite;
      }
      
      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="splash-content">
        <img src="/assetes/taskmtaa-logo.jpg" alt="TaskMtaa logo" class="splash-logo" />
        <p class="splash-name">TaskMtaa</p>
        <div class="loader"></div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Hide splash screen when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('splash-screen')?.classList.add('hide');
          setTimeout(() => {
            document.getElementById('splash-screen')?.remove();
          }, 300);
        }, 500);
      });
      
      // Prevent double-tap zoom on iOS
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (event) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    </script>
  </body>
</html>
